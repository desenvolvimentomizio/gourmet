; Modelo de configuracao do Gourmet API.
; Copie para config.ini e preencha. config.ini NAO deve ser versionado
; (ver .gitignore). Em producao, prefira variaveis de ambiente.

[http]
port=9000

; Banco control-plane: registro de tenants, usuarios, assinaturas, webhooks.
[control]
host=192.168.5.159
port=3306
user=gourmet_app
password=TROCAR
schema=saas_control

; Servidor MySQL onde vivem os schemas dos tenants (1 schema por cliente).
[tenant]
host=192.168.5.159
port=3306
user=gourmet_app
password=TROCAR

[security]
; Segredo HS256 do JWT. Gere um valor forte e mantenha fora do repo.
jwt_secret=TROCAR_POR_SEGREDO_FORTE
jwt_issuer=gourmet-saas
